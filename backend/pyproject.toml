[project]
name = "emoera-backend"
version = "0.1.0"
description = "Emoera 日常自动化与消息聚合 - FastAPI 后端"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "apscheduler>=3.10",
    # 浏览器自动化（社交媒体）。demo 模式不需要安装浏览器，按需安装：
    #   pip install playwright && playwright install chromium
    "playwright>=1.45",
]

[project.optional-dependencies]
dev = ["ruff>=0.5", "pytest>=8.0", "pytest-asyncio>=0.23"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
